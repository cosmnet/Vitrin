# Merge this block into ~/.codex/config.toml.
[mcp_servers.vitrin]
command = "node"
args = ["/absolute/path/to/vitrin-mcp/dist/index.js"]
cwd = "/absolute/path/to/vitrin-mcp"
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.vitrin.env]
VITRIN_DIR = "/absolute/path/to/vitrin-studio"
VITRIN_PORT = "4780"
